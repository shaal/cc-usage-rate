<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Outer glow/shadow effect -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22c55e" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="64" cy="64" r="58" fill="url(#bgGradient)" stroke="#22c55e" stroke-width="4" filter="url(#shadow)"/>

  <!-- Track circle (lighter) -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#bbf7d0" stroke-width="8"/>

  <!-- Progress arc -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="282.74" stroke-dashoffset="70.69" stroke-linecap="round" transform="rotate(-90 64 64)"/>

  <!-- Inner circle -->
  <circle cx="64" cy="64" r="32" fill="#f0fdf4"/>

  <!-- Percentage text -->
  <text x="64" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#16a34a">75%</text>

  <!-- Subtitle text -->
  <text x="64" y="82" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">USAGE</text>
</svg>
